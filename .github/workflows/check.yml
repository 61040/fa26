name: Check site

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restore image renditions
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/syncpress/images
          key: ${{ runner.os }}-${{ runner.arch }}-syncpress-images-v1-${{ hashFiles('package-lock.json') }}-pr-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-syncpress-images-v1-${{ hashFiles('package-lock.json') }}-
      - name: Build site
        run: npm run build
