name: Publish to GitHub Pages

# Publishes main at the site root, each draft/* branch at /draft/<name>/, and
# each open pull request at /pr/<number>/. Every run rebuilds all of them, so
# a closed pull request or deleted branch drops out on the next deploy.
#
# Pull requests run through pull_request_target, so this file always comes
# from main. Only pull requests from branches in this repository, or from
# people with write access, are built: a preview runs the pull request's build
# and publishes its pages on the course site.

on:
  push:
    branches: [main, 'draft/**']
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate build matrix
        id: generate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Start with main
          sites='[{"name":"main","ref":"main"}]'

          # Get all draft branches and convert to JSON objects
          draft_branches=$(git branch -r --list 'origin/draft/*' | sed 's|.*origin/draft/||' | sort)

          if [[ -n "$draft_branches" ]]; then
            # Convert each line to {"name":"draft/..."} format and append
            while IFS= read -r branch; do
              sites=$(echo "$sites" | jq -c ". += [{\"name\":\"draft/$branch\",\"ref\":\"draft/$branch\"}]")
            done <<< "$draft_branches"
          fi

          # Open pull requests from this repository or from people with write access
          previews=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq '
            .[]
            | select(.head.repo.full_name == .base.repo.full_name
                     or .author_association == "OWNER"
                     or .author_association == "MEMBER"
                     or .author_association == "COLLABORATOR")
            | .number' | sort -n)

          for number in $previews; do
            sites=$(echo "$sites" | jq -c ". += [{\"name\":\"pr/$number\",\"ref\":\"refs/pull/$number/head\"}]")
          done

          # Output as compact JSON (no newlines)
          sites=$(echo "$sites" | jq -c '.')
          echo "matrix=$sites" >> $GITHUB_OUTPUT
          echo "Build matrix: $sites"

  build-all:
    runs-on: ubuntu-latest
    needs: build-matrix
    # A pull request that doesn't build gets no preview, but doesn't stop the
    # rest of the site from deploying.
    continue-on-error: ${{ startsWith(matrix.name, 'pr/') }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build-matrix.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false

      - name: Determine configuration for ${{ matrix.name }}
        id: config
        shell: bash
        run: |
          name="${{ matrix.name }}"
          repository="${GITHUB_REPOSITORY#*/}"

          # Determine base path based on repo type
          if [[ "${repository}" == *.github.io ]]; then
            repo_base_path="/"
          else
            repo_base_path="/${repository}/"
          fi

          if [[ "$name" == "main" ]]; then
            base_path="${repo_base_path}"
            artifact_name="site-main"
          elif [[ "$name" == pr/* ]]; then
            # Extract pull request number: pr/12 -> 12
            number="${name#pr/}"
            base_path="${repo_base_path}pr/${number}/"
            artifact_name="site-pr-${number}"
          else
            # Extract draft name: draft/pset1 -> pset1
            draft_name="${name#draft/}"
            base_path="${repo_base_path}draft/${draft_name}/"
            artifact_name="site-draft-${draft_name}"
          fi

          echo "base_path=${base_path}" >> $GITHUB_OUTPUT
          echo "artifact_name=${artifact_name}" >> $GITHUB_OUTPUT
          echo "Building $name with base_path=${base_path}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Update site.yaml
        shell: bash
        env:
          BASE_PATH: ${{ steps.config.outputs.base_path }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER}"
          repository="${GITHUB_REPOSITORY#*/}"

          sed -i "s|origin: .*|origin: https://${owner}.github.io|" site.yaml
          sed -i "s|basePath: .*|basePath: ${BASE_PATH}|" site.yaml

          echo "Configuration for ${{ matrix.name }}:"
          grep -E "origin:|basePath:" site.yaml

      - name: Install dependencies
        run: npm ci

      # Pull request builds only read the image cache, so they can't change
      # what main and draft builds restore.
      - name: Cache image renditions
        if: ${{ !startsWith(matrix.name, 'pr/') }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/syncpress/images
          key: ${{ runner.os }}-${{ runner.arch }}-syncpress-images-v1-${{ hashFiles('package-lock.json') }}-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-syncpress-images-v1-${{ hashFiles('package-lock.json') }}-${{ matrix.name }}-
            ${{ runner.os }}-${{ runner.arch }}-syncpress-images-v1-${{ hashFiles('package-lock.json') }}-

      - name: Restore image renditions
        if: ${{ startsWith(matrix.name, 'pr/') }}
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/syncpress/images
          key: ${{ runner.os }}-${{ runner.arch }}-syncpress-images-v1-${{ hashFiles('package-lock.json') }}-main-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-syncpress-images-v1-${{ hashFiles('package-lock.json') }}-main-
            ${{ runner.os }}-${{ runner.arch }}-syncpress-images-v1-${{ hashFiles('package-lock.json') }}-

      - name: Build site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.config.outputs.artifact_name }}
          path: dist
          include-hidden-files: true
          retention-days: 1

  merge-and-deploy:
    runs-on: ubuntu-latest
    needs: [build-matrix, build-all]
    if: needs.build-all.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      previews: ${{ steps.merge.outputs.previews }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Merge all sites
        id: merge
        shell: bash
        run: |
          mkdir -p merged-site

          # Never deploy without main: it would replace the whole site
          if [[ ! -d artifacts/site-main ]]; then
            echo "main didn't build; not deploying"
            exit 1
          fi
          echo "Merging main site..."
          cp -r artifacts/site-main/* merged-site/

          # Process all draft sites
          for draft_artifact in artifacts/site-draft-*; do
            if [[ -d "$draft_artifact" ]]; then
              draft_name=$(basename "$draft_artifact" | sed 's/site-draft-//')
              echo "Merging draft: $draft_name"
              mkdir -p "merged-site/draft/${draft_name}"
              cp -r "$draft_artifact"/* "merged-site/draft/${draft_name}/"
            fi
          done

          # Process all pull request previews
          previews=""
          for pr_artifact in artifacts/site-pr-*; do
            if [[ -d "$pr_artifact" ]]; then
              number=$(basename "$pr_artifact" | sed 's/site-pr-//')
              echo "Merging pull request: $number"
              mkdir -p "merged-site/pr/${number}"
              cp -r "$pr_artifact"/* "merged-site/pr/${number}/"
              previews="$previews $number"
            fi
          done
          echo "previews=${previews# }" >> $GITHUB_OUTPUT

          # Ensure .nojekyll
          touch merged-site/.nojekyll

          echo "Merged structure:"
          find merged-site -maxdepth 2 -type f | sort | head -40

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: merged-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  comment-previews:
    runs-on: ubuntu-latest
    needs: merge-and-deploy
    if: needs.merge-and-deploy.outputs.previews != ''
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Link each pull request to its preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEWS: ${{ needs.merge-and-deploy.outputs.previews }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER}"
          repository="${GITHUB_REPOSITORY#*/}"
          if [[ "${repository}" == *.github.io ]]; then
            site="https://${owner}.github.io/"
          else
            site="https://${owner}.github.io/${repository}/"
          fi
          marker='<!-- pages-preview -->'

          for number in $PREVIEWS; do
            body="${marker}
          Preview: ${site}pr/${number}/

          It updates with each push to this pull request."
            existing=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${number}/comments" \
              --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${marker}\"))) | .id" | head -1)
            if [[ -z "$existing" ]]; then
              gh api "repos/${GITHUB_REPOSITORY}/issues/${number}/comments" -f body="$body" > /dev/null
              echo "Commented on #${number}"
            fi
          done
